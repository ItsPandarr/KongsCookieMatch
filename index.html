<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Kong's Cookie Match</title>
<meta name="description" content="A spooky match-3 cookie puzzle game.">
<style>
  :root {
    --bg1: #1a1030;
    --bg2: #07030f;
    --panel: #2a1a4a;
    --accent: #ff9f43;
    --text: #f6efff;
    --muted: #b7a6d8;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: ui-rounded, "Trebuchet MS", system-ui, sans-serif;
    color: var(--text);
    background: radial-gradient(ellipse at 50% 0%, var(--bg1), var(--bg2) 70%) fixed;
    display: flex; flex-direction: column; align-items: center;
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    user-select: none; -webkit-user-select: none;
    overflow-x: hidden;
  }
  #app { width: 100%; max-width: 560px; display: flex; flex-direction: column; gap: 10px; }
  h1 {
    margin: 4px 0 0; text-align: center; font-size: clamp(22px, 5vw, 32px);
    letter-spacing: .5px; color: var(--accent);
    text-shadow: 0 0 18px rgba(255,159,67,.55), 0 2px 0 #5a2d00;
  }
  #stats { display: grid; grid-template-columns: 1fr 1.9fr 1fr; align-items: stretch; gap: 8px; }
  .stat { background: var(--panel); border-radius: 12px; padding: 6px 8px; text-align: center; border: 1px solid rgba(255,255,255,.08); }
  .stat small { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
  .stat b { font-size: clamp(18px, 4.5vw, 24px); font-variant-numeric: tabular-nums; }
  .stat.score { background: linear-gradient(180deg, #4a2a80, #2a1a4a); border-color: rgba(255,159,67,.55); box-shadow: 0 0 18px rgba(255,159,67,.25); padding: 4px 8px 6px; }
  .stat.score small { color: var(--accent); }
  .stat.score b { display: inline-block; font-size: clamp(32px, 9vw, 46px); line-height: 1.1; color: #ffd166; text-shadow: 0 0 14px rgba(255,159,67,.6), 0 2px 0 #5a2d00; }
  .stat.score b.bump { animation: bump .3s ease; }
  @keyframes bump { 40% { transform: scale(1.18); } }
  #goal { height: 10px; border-radius: 6px; background: #120a23; overflow: hidden; border: 1px solid rgba(255,255,255,.08); }
  #goalBar { height: 100%; width: 0; background: linear-gradient(90deg, #ff9f43, #ffd166); transition: width .35s ease; }
  #goalLabel { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 2px 12px; margin-top: -4px; padding: 0 4px; }
  #goalLabel b { color: var(--text); }
  #goalLabel .total { font-size: 13px; }
  #goalLabel .total b { color: #ffd166; font-size: 15px; }
  #boardWrap { position: relative; align-self: center; }
  canvas { display: block; border-radius: 16px; touch-action: none; box-shadow: 0 10px 40px rgba(0,0,0,.6), 0 0 0 2px rgba(255,159,67,.25); background: #150b28; }
  #buttons { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .stat b.low { color: #ff6b81; }
  button {
    font: inherit; font-weight: 700; color: var(--text); background: var(--panel);
    border: 1px solid rgba(255,255,255,.15); border-radius: 12px; padding: 9px 16px; cursor: pointer;
  }
  button:hover { background: #3a2563; }
  button:active { transform: translateY(1px); }
  button.primary { background: var(--accent); color: #2a1200; border-color: transparent; }
  button.primary:hover { background: #ffb26b; }
  #overlay {
    position: absolute; inset: 0; border-radius: 16px; display: none;
    flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    background: rgba(10,4,22,.82); backdrop-filter: blur(3px); text-align: center; padding: 20px;
  }
  #overlay.show { display: flex; animation: fade .25s ease; }
  #overlay h2 { margin: 0; font-size: 30px; color: var(--accent); }
  #overlay p { margin: 0; color: var(--muted); font-size: 16px; line-height: 1.4; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  #footer { text-align: center; font-size: 14px; color: var(--muted); padding: 4px 0 2px; }
  #footer a { color: var(--accent); font-weight: 700; text-decoration: none; }
  #footer a:hover { text-decoration: underline; }
  #loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); }
</style>
</head>
<body>
<div id="app">
  <h1>🎃 Kong's Cookie Match</h1>
  <div id="stats">
    <div class="stat"><small>Level</small><b id="level">1</b></div>
    <div class="stat score"><small>Level Score</small><b id="score">0</b></div>
    <div class="stat"><small id="movesLabel">Moves</small><b id="moves">0</b></div>
  </div>
  <div id="goal"><div id="goalBar"></div></div>
  <div id="goalLabel"></div>
  <div id="boardWrap">
    <canvas id="board"></canvas>
    <div id="overlay"><h2 id="ovTitle"></h2><p id="ovText"></p><button class="primary" id="ovBtn"></button></div>
  </div>
  <div id="buttons">
    <button id="hintBtn">💡 Hint</button>
    <button id="cbBtn">👁 Colorblind: Off</button>
    <button id="timerBtn">⏱ Timer: Off</button>
    <button id="soundBtn">🔊 Sound</button>
    <button id="restartBtn">↻ Restart</button>
  </div>
  <div id="footer">Catch Kong live on <a href="https://www.twitch.tv/kong" target="_blank" rel="noopener noreferrer">twitch.tv/kong</a> 💜</div>
</div>

// Tile types: 3 original cookies + 2 color-shifted variants.
// [source image, hue rotation, saturation, brightness, flipped upside-down, background pattern, ring color]
// Pattern + brightness + flip differ per type so tiles are distinguishable without relying on color.
const TYPE_DEFS = [
  { img: 0, hue: 0,   sat: 1,   bri: 1,    flip: false, pattern: 'stripes',  color: '#ff9f43' },
  { img: 1, hue: 0,   sat: 1,   bri: 1,    flip: false, pattern: 'dots',  color: '#c56cf0' },
  { img: 2, hue: 0,   sat: 1,   bri: 1,    flip: false, pattern: 'checker',  color: '#7efff5' },
  { img: 0, hue: 105, sat: 2.2, bri: 1.45, flip: false, pattern: 'grid',  color: '#7bed9f' },
  { img: 1, hue: 200, sat: 1.8, bri: 1.6,  flip: false, pattern: 'zigzag',  color: '#ff6b81' }
];
const TYPES = TYPE_DEFS.length;
const ROWS = 8, COLS = 8;
const MOVES_PER_LEVEL = 25;
const targetFor = lvl => 500 + (lvl - 1) * 300;
// Timer mode: 30s on level 1, one second less per level, never below 15s
const timeFor = lvl => Math.max(15, 31 - lvl);

// ---------- DOM ----------
const $ = id => document.getElementById(id);
const canvas = $('board'), ctx = canvas.getContext('2d');
const overlay = $('overlay');

// ---------- State ----------
let images = [];            // one canvas/img per tile type
let grid = [];              // grid[r][c] = tile | null
let cs = 60, dpr = 1;       // cell size (css px), device pixel ratio
let level = 1, score = 0, levelScore = 0, moves = MOVES_PER_LEVEL, best = 0;
let busy = true, over = false;
let sel = null, drag = null;
let hint = null, lastActivity = performance.now();
let effects = [];           // particles + popups
let shake = 0;
let soundOn = true;
let patternsOn = false;     // colorblind mode: draw a distinct pattern on each tile type
let timerMode = false, timeLeft = 0, timerRunning = false, lastTick = 0;

try { best = +localStorage.getItem('cookieMatchBest') || 0; } catch (e) {}
try { patternsOn = localStorage.getItem('cookieMatchPatterns') === '1'; } catch (e) {}
try { timerMode = localStorage.getItem('cookieMatchTimer') === '1'; } catch (e) {}
try { soundOn = localStorage.getItem('cookieMatchSound') !== '0'; } catch (e) {}

// ---------- Helpers ----------
const rand = n => Math.floor(Math.random() * n);
const ease = {
  inOut: t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2,
  out: t => 1 - Math.pow(1 - t, 3),
  inQuad: t => t * t,
  outBack: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); }
};
function tween(ms, fn) {
  return new Promise(res => {
    const s = performance.now();
    (function step() {
      const t = Math.min(1, Math.max(0, (performance.now() - s) / ms));
      fn(t);
      t < 1 ? requestAnimationFrame(step) : res();
    })();
  });
}
const sleep = ms => new Promise(r => setTimeout(r, ms));

// ---------- Sound (tiny synthesized blips) ----------
let actx = null;
function blip(freq, dur = .12, type = 'sine', vol = .12, slide = 0) {
  if (!soundOn) return;

    if (actx.state === 'suspended') actx.resume();
    const o = actx.createOscillator(), g = actx.createGain();

    g.gain.setValueAtTime(vol, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur);

}
const sfx = {
  swap: () => blip(330, .08, 'triangle', .08),
  bad: () => blip(140, .18, 'sawtooth', .07, .6),
  pop: combo => blip(440 * Math.pow(1.122, Math.min(combo, 8) * 2), .16, 'sine', .14, 1.5),
  win: () => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => blip(f, .25, 'triangle', .12), i * 110)),
  lose: () => [392, 330, 262, 196].forEach((f, i) => setTimeout(() => blip(f, .3, 'sawtooth', .08), i * 160))
};

// ---------- Image prep ----------
function loadImage(src) {
  return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
}
function tint(img, hue, sat, bri, flip) {
  const c = document.createElement('canvas');
  c.width = img.width; c.height = img.height;
  const x = c.getContext('2d');
  if (flip) { x.translate(0, c.height); x.scale(1, -1); }
  x.drawImage(img, 0, 0);
  if (!hue && sat === 1 && bri === 1) return c;
  const d = x.getImageData(0, 0, c.width, c.height), p = d.data;
  const a = hue * Math.PI / 180, cos = Math.cos(a), sin = Math.sin(a);
  const m = [
    .213 + cos * .787 - sin * .213, .715 - cos * .715 - sin * .715, .072 - cos * .072 + sin * .928,
    .213 - cos * .213 + sin * .143, .715 + cos * .285 + sin * .140, .072 - cos * .072 - sin * .283,
    .213 - cos * .213 - sin * .787, .715 - cos * .715 + sin * .715, .072 + cos * .928 + sin * .072
  ];
  const clamp = v => v < 0 ? 0 : v > 255 ? 255 : v;
  for (let i = 0; i < p.length; i += 4) {
    let r = p[i], g = p[i + 1], b = p[i + 2];
    const l = .299 * r + .587 * g + .114 * b;
    r = (l + (r - l) * sat) * bri; g = (l + (g - l) * sat) * bri; b = (l + (b - l) * sat) * bri;
    p[i]     = clamp(r * m[0] + g * m[1] + b * m[2]);
    p[i + 1] = clamp(r * m[3] + g * m[4] + b * m[5]);
    p[i + 2] = clamp(r * m[6] + g * m[7] + b * m[8]);
  }
  x.putImageData(d, 0, 0);
  return c;
}

// ---------- Board logic ----------
const newTile = (type, r, c, y) => ({ type, x: c, y: y === undefined ? r : y, scale: 1, alpha: 1 });
const typeAt = (g, r, c) => (r < 0 || c < 0 || r >= ROWS || c >= COLS || !g[r][c]) ? -1 : g[r][c].type;

function findRuns(g = grid) {
  const runs = [];
  for (let r = 0; r < ROWS; r++) {
    let c = 0;
    while (c < COLS) {
      const t = typeAt(g, r, c); let e = c;
      while (t >= 0 && typeAt(g, r, e + 1) === t) e++;
      if (t >= 0 && e - c >= 2) { const cells = []; for (let k = c; k <= e; k++) cells.push([r, k]); runs.push(cells); }
      c = e + 1;
    }
  }
  for (let c = 0; c < COLS; c++) {
    let r = 0;
    while (r < ROWS) {
      const t = typeAt(g, r, c); let e = r;
      while (t >= 0 && typeAt(g, e + 1, c) === t) e++;
      if (t >= 0 && e - r >= 2) { const cells = []; for (let k = r; k <= e; k++) cells.push([k, c]); runs.push(cells); }
      r = e + 1;
    }
  }
  return runs;
}

function findMoves() {
  const out = [];
  const swapTest = (r1, c1, r2, c2) => {
    const a = grid[r1][c1], b = grid[r2][c2];
    grid[r1][c1] = b; grid[r2][c2] = a;
    const ok = findRuns().length > 0;
    grid[r1][c1] = a; grid[r2][c2] = b;
    if (ok) out.push([[r1, c1], [r2, c2]]);
  };
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    if (c + 1 < COLS) swapTest(r, c, r, c + 1);
    if (r + 1 < ROWS) swapTest(r, c, r + 1, c);
  }
  return out;
}

function fillRandom() {
  // random board with no existing matches and at least one available move
  do {
    grid = [];
    for (let r = 0; r < ROWS; r++) {
      grid.push([]);
      for (let c = 0; c < COLS; c++) {
        let t;
        do { t = rand(TYPES); }
        while ((c >= 2 && grid[r][c - 1].type === t && grid[r][c - 2].type === t) ||
               (r >= 2 && grid[r - 1][c].type === t && grid[r - 2][c].type === t));
        grid[r].push(newTile(t, r, c));
      }
    }
  } while (findMoves().length === 0);
}

// ---------- Effects ----------
function burst(cx, cy, color, n = 8) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = (1.2 + Math.random() * 3) / 60;
    effects.push({ kind: 'p', x: cx, y: cy, vx: Math.cos(a) * s * 60, vy: Math.sin(a) * s * 60 - .8,
      born: performance.now(), life: 550 + Math.random() * 250, color, size: .05 + Math.random() * .06 });
  }
}
function popup(x, y, text, color = '#fff', big = false) {
  effects.push({ kind: 't', x, y, text, color, big, born: performance.now(), life: 900 });
}

// ---------- Rendering ----------
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function plateShape(h) { roundRect(-h, -h, h * 2, h * 2, cs * .2); }

// Background pattern drawn inside the plate (clipped), so tile types differ by more than color.
function drawPattern(kind, h, color) {
  const u = cs / 8;                       // pattern unit
  ctx.save();
  plateShape(h); ctx.clip();
  ctx.strokeStyle = color; ctx.fillStyle = color;
  ctx.globalAlpha *= .26;
  ctx.lineWidth = Math.max(1.5, u * .9);
  ctx.beginPath();
  if (kind === 'stripes') {
    for (let k = -h * 2; k < h * 2; k += u * 2.2) { ctx.moveTo(k - h, h); ctx.lineTo(k + h, -h); }
    ctx.stroke();
  } else if (kind === 'dots') {
    for (let y = -h + u; y < h; y += u * 1.7) for (let x = -h + u * .8; x < h; x += u * 1.7) { ctx.moveTo(x + u * .5, y); ctx.arc(x, y, u * .5, 0, Math.PI * 2); }
    ctx.fill();
  } else if (kind === 'checker') {
    const n = u * 1.7;
    for (let y = -h, i = 0; y < h; y += n, i++) for (let x = -h, j = 0; x < h; x += n, j++) if ((i + j) % 2) ctx.rect(x, y, n, n);
    ctx.fill();
  } else if (kind === 'grid') {
    for (let k = -h; k < h; k += u * 2.2) { ctx.moveTo(k, -h); ctx.lineTo(k, h); ctx.moveTo(-h, k); ctx.lineTo(h, k); }
    ctx.lineWidth = Math.max(1, u * .55);
    ctx.stroke();
  } else if (kind === 'zigzag') {
    const step = u * 1.6;
    for (let y = -h + u; y < h; y += u * 2.6) {
      ctx.moveTo(-h, y);
      for (let x = -h, up = true; x <= h + step; x += step, up = !up) ctx.lineTo(x + step, y + (up ? -u * .9 : u * .9));
    }
    ctx.lineWidth = Math.max(1.2, u * .6);
    ctx.stroke();
  }
  ctx.restore();
}

function drawTile(t, r, c, now) {
  const def = TYPE_DEFS[t.type];
  const isSel = sel && sel[0] === r && sel[1] === c;
  const isHint = hint && now < hint.until && hint.cells.some(h => h[0] === r && h[1] === c);
  let scale = t.scale;
  let ox = 0, oy = 0;
  if (isSel) scale *= 1.08 + Math.sin(now / 120) * .03;
  if (isHint) { const w = Math.sin(now / 110); scale *= 1.05 + w * .05; }

  ctx.save();
  ctx.translate((t.x + .5) * cs + ox, (t.y + .5) * cs + oy);
  ctx.scale(scale, scale);
  ctx.globalAlpha = t.alpha;

  // plate
  const s = cs * .9, h = s / 2;
  const grad = ctx.createLinearGradient(0, -h, 0, h);

  grad.addColorStop(1, '#22123f');

  ctx.fillStyle = grad; ctx.fill();
  ctx.lineWidth = Math.max(2, cs * .045);

  ctx.stroke();
  ctx.globalAlpha = t.alpha;

  const glow = ctx.createRadialGradient(0, 0, 0, 0, 0, h);
  glow.addColorStop(0, def.color + '40'); glow.addColorStop(1, def.color + '00');

  ctx.fillStyle = glow; ctx.fill();

function tick(now) {
  const dt = Math.min(now - lastTick, 100);   // capped, so a hidden tab pauses the clock
  lastTick = now;
  if (!timerMode || !timerRunning) return;
  const before = Math.ceil(timeLeft);
  timeLeft = Math.max(0, timeLeft - dt / 1000);
  if (Math.ceil(timeLeft) !== before) updateHUD();
  if (timeLeft <= 0) { timerRunning = false; if (!busy) timeUpCheck(); }
}

async function timeUpCheck() {
  if (!timerMode || over || timeLeft > 0) return;
  busy = true; sel = null; drag = null;

}

function render() {
  const now = performance.now();
  tick(now);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // board backdrop checker
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    ctx.fillStyle = (r + c) % 2 ? 'rgba(255,255,255,.035)' : 'rgba(255,255,255,.0)';
    ctx.fillRect(c * cs, r * cs, cs, cs);
  }

  ctx.save();

  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {

  }
  ctx.restore();

  effects = effects.filter(e => now - e.born < e.life);

    const age = (now - e.born) / e.life;

      const dt = (now - e.born) / 1000;

// ---------- Game flow ----------
function updateHUD() {
  $('level').textContent = level;
  const sc = $('score');
  if (sc.textContent !== String(levelScore)) {
    const grew = levelScore > (+sc.textContent || 0);
    sc.textContent = levelScore;
    if (grew) { sc.classList.remove('bump'); void sc.offsetWidth; sc.classList.add('bump'); }
  }
  if (timerMode) {
    const t = Math.max(0, Math.ceil(timeLeft));
    $('movesLabel').textContent = 'Time';
    $('moves').textContent = t + 's';
    $('moves').classList.toggle('low', t <= 5);
  } else {
    $('movesLabel').textContent = 'Moves';
    $('moves').textContent = moves;
    $('moves').classList.remove('low');
  }
  const target = targetFor(level);
  $('goalBar').style.width = Math.min(100, levelScore / target * 100) + '%';
  $('goalLabel').innerHTML = `<span>Goal: <b>${target}</b>` + (timerMode ? ` · ${timeFor(level)}s per level` : '') + ` · Best level: ${best || 1}</span><span class="total">Total score: <b>${score}</b></span>`;
}

async function swapTiles(a, b, ms = 170) {
  const ta = grid[a[0]][a[1]], tb = grid[b[0]][b[1]];
  grid[a[0]][a[1]] = tb; grid[b[0]][b[1]] = ta;
  const ax = ta.x, ay = ta.y, bx = tb.x, by = tb.y;
  await tween(ms, p => {
    const e = ease.inOut(p);
    ta.x = ax + (bx - ax) * e; ta.y = ay + (by - ay) * e;
    tb.x = bx + (ax - bx) * e; tb.y = by + (ay - by) * e;
  });
}

async function trySwap(a, b) {
  if (busy || over || (timerMode && timeLeft <= 0)) return;
  busy = true; sel = null; hint = null; lastActivity = performance.now();
  sfx.swap();
  await swapTiles(a, b);
  if (findRuns().length === 0) {
    sfx.bad(); shake = 6;
    await swapTiles(a, b, 150);   // swap back
    busy = false;
    await timeUpCheck();
    return;
  }
  if (!timerMode) moves--;
  updateHUD();
  await resolveBoard();
  await afterTurn();
}

async function resolveBoard() {
  let combo = 0;
  for (;;) {
    const runs = findRuns();
    if (!runs.length) break;
    combo++;
    const cells = new Map();
    let pts = 0;
    for (const run of runs) {
      pts += run.length * 10 + (run.length - 3) * 25;
      run.forEach(([r, c]) => cells.set(r * COLS + c, [r, c]));
    }
    // intersecting runs (L/T shapes) earn a bonus
    const total = runs.reduce((n, r) => n + r.length, 0);
    if (total > cells.size) pts += 40;
    pts *= combo;
    score += pts; levelScore += pts;

    // popups
    let sx = 0, sy = 0;
    cells.forEach(([r, c]) => { sx += c + .5; sy += r + .5; });
    popup(sx / cells.size, sy / cells.size, '+' + pts, '#ffd166');
    if (combo > 1) popup(COLS / 2, ROWS / 2 - .5 + Math.min(combo, 4) * .1, `Combo x${combo}!`, '#ff9f43', true);
    sfx.pop(combo);

    const list = [...cells.values()].map(([r, c]) => grid[r][c]);
    list.forEach((t, i) => burst(t.x + .5, t.y + .5, TYPE_DEFS[t.type].color, 7));
    await tween(220, p => list.forEach(t => { t.scale = 1 + .15 * Math.sin(p * Math.PI) - p; t.alpha = 1 - p * p; }));
    cells.forEach(([r, c]) => { grid[r][c] = null; });
    updateHUD();
    await applyGravity();
  }
}

async function applyGravity() {
  const anims = [];
  for (let c = 0; c < COLS; c++) {
    let write = ROWS - 1;
    for (let r = ROWS - 1; r >= 0; r--) {
      const t = grid[r][c];
      if (t) {
        if (r !== write) { grid[write][c] = t; grid[r][c] = null; anims.push({ t, to: write }); }
        write--;
      }
    }
    for (let r = write; r >= 0; r--) {
      const t = newTile(rand(TYPES), r, c, r - (write + 1) - 1);
      grid[r][c] = t; anims.push({ t, to: r });
    }
  }
  if (!anims.length) return;
  anims.forEach(a => { a.from = a.t.y; a.dur = 160 + 75 * Math.sqrt(a.to - a.from); });
  const start = performance.now();
  const maxDur = Math.max(...anims.map(a => a.dur));
  await tween(maxDur, () => {
    const el = performance.now() - start;
    for (const a of anims) {
      const p = Math.min(1, el / a.dur);
      a.t.y = a.from + (a.to - a.from) * (p < 1 ? ease.inQuad(p) * .35 + p * .65 : 1);
    }
  });
  for (const a of anims) a.t.y = a.to;
}

async function afterTurn() {
  updateHUD();
  const target = targetFor(level);
  if (levelScore >= target) { await levelComplete(); return; }
  if (timerMode ? timeLeft <= 0 : moves <= 0) { await gameOver(); return; }
  if (findMoves().length === 0) await reshuffle();
  lastActivity = performance.now();
  busy = false;
}

async function reshuffle() {
  popup(COLS / 2, ROWS / 2, 'No moves — shuffling!', '#7efff5', true);
  await sleep(500);
  const all = grid.flat();
  await tween(200, p => all.forEach(t => { t.scale = 1 - p; }));
  do {
    const types = all.map(t => t.type);
    for (let i = types.length - 1; i > 0; i--) { const j = rand(i + 1); [types[i], types[j]] = [types[j], types[i]]; }
    all.forEach((t, i) => { t.type = types[i]; });
    // if shuffling can't avoid matches, fall back to a fresh board
    if (findRuns().length || findMoves().length === 0) {
      let guard = 0;
      do { all.forEach(t => { t.type = rand(TYPES); }); } while ((findRuns().length || !findMoves().length) && ++guard < 500);
    }
  } while (findRuns().length || findMoves().length === 0);
  await tween(260, p => all.forEach(t => { t.scale = ease.outBack(p); }));
  all.forEach(t => { t.scale = 1; });
}

function showOverlay(title, text, btn, fn) {
  $('ovTitle').textContent = title; $('ovText').innerHTML = text; $('ovBtn').textContent = btn;
  $('ovBtn').onclick = () => { overlay.classList.remove('show'); fn(); };
  overlay.classList.add('show');
}

async function levelComplete() {
  over = true; timerRunning = false;
  const bonus = timerMode ? Math.ceil(Math.max(0, timeLeft)) * 10 : moves * 20;
  score += bonus; updateHUD();
  const next = level + 1;
  best = Math.max(best, next);
  try { localStorage.setItem('cookieMatchBest', best); } catch (e) {}
  sfx.win();
  await sleep(500);
  showOverlay('🎉 Level ' + level + ' Complete!',
    `Level score: <b>${levelScore}</b> / ${targetFor(level)}${bonus ? `<br>${timerMode ? 'Time' : 'Leftover moves'} bonus: <b>+${bonus}</b>` : ''}<br>Total score: <b>${score}</b><br>Next goal: ${targetFor(next)} points`,
    'Next Level', () => { level = next; startLevel(true); });
}

async function gameOver() {
  over = true; timerRunning = false;
  sfx.lose();
  await sleep(500);
  showOverlay(timerMode ? '⏰ Time\'s up!' : '👻 Out of moves!',
    `You reached level <b>${level}</b> with a total of <b>${score}</b> points.<br>This level: ${levelScore} / ${targetFor(level)}.`,
    'Try Again', () => { level = 1; score = 0; startLevel(false); });
}

async function startLevel(keepScore) {
  if (!keepScore) score = 0;
  levelScore = 0;
  moves = MOVES_PER_LEVEL; timeLeft = timeFor(level); timerRunning = false;
  over = false; busy = true; sel = null; hint = null; effects = [];
  fillRandom();
  // drop-in intro animation
  const tiles = [];
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) { const t = grid[r][c]; t.y = r - ROWS - 1; tiles.push({ t, to: r, d: (ROWS - r) * 25 + c * 15 }); }
  updateHUD();
  const start = performance.now();
  await tween(900 + 400, () => {
    const el = performance.now() - start;
    for (const a of tiles) {
      const p = Math.max(0, Math.min(1, (el - a.d) / 500));
      a.t.y = (a.to - ROWS - 1) + (ROWS + 1) * ease.out(p);
    }
  });
  tiles.forEach(a => { a.t.y = a.to; });
  lastActivity = performance.now();
  lastTick = performance.now();
  busy = false;
  timerRunning = timerMode;
}

function showHint() {
  if (busy || over) return;
  const m = findMoves();
  if (!m.length) return;
  hint = { cells: m[rand(m.length)], until: performance.now() + 2500 };
  lastActivity = performance.now();
}

// ---------- Input ----------
function cellFromEvent(e) {
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) / rect.width * COLS;
  const y = (e.clientY - rect.top) / rect.height * ROWS;
  const c = Math.floor(x), r = Math.floor(y);
  return (r < 0 || c < 0 || r >= ROWS || c >= COLS) ? null : [r, c];
}
const adjacent = (a, b) => Math.abs(a[0] - b[0]) + Math.abs(a[1] - b[1]) === 1;

canvas.addEventListener('pointerdown', e => {
  if (busy || over) return;
  e.preventDefault();
  lastActivity = performance.now(); hint = null;
  const cell = cellFromEvent(e);
  if (!cell) return;
  if (sel && adjacent(sel, cell)) { const s = sel; sel = null; drag = null; trySwap(s, cell); return; }
  drag = { start: cell, x: e.clientX, y: e.clientY };
  sel = (sel && sel[0] === cell[0] && sel[1] === cell[1]) ? null : cell;
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
});
canvas.addEventListener('pointermove', e => {
  if (!drag || busy || over) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  const rect = canvas.getBoundingClientRect(), cellPx = rect.width / COLS;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < cellPx * .35) return;
  const [r, c] = drag.start;
  const target = Math.abs(dx) > Math.abs(dy) ? [r, c + Math.sign(dx)] : [r + Math.sign(dy), c];
  const s = drag.start; drag = null; sel = null;
  if (target[0] >= 0 && target[0] < ROWS && target[1] >= 0 && target[1] < COLS) trySwap(s, target);
});
['pointerup', 'pointercancel'].forEach(ev => canvas.addEventListener(ev, () => { drag = null; }));

$('hintBtn').onclick = showHint;
$('restartBtn').onclick = () => { if (overlay.classList.contains('show')) overlay.classList.remove('show'); level = 1; score = 0; startLevel(false); };
function updateCbBtn() { $('cbBtn').textContent = patternsOn ? '👁 Colorblind: On' : '👁 Colorblind: Off'; }
$('cbBtn').onclick = () => {
  patternsOn = !patternsOn; updateCbBtn();
  try { localStorage.setItem('cookieMatchPatterns', patternsOn ? '1' : '0'); } catch (e) {}
};
function updateTimerBtn() { $('timerBtn').textContent = timerMode ? '⏱ Timer: On' : '⏱ Timer: Off'; }
$('timerBtn').onclick = () => {
  if (score > 0 && !over && !confirm('Switching modes restarts the game. Continue?')) return;
  timerMode = !timerMode; updateTimerBtn();
  try { localStorage.setItem('cookieMatchTimer', timerMode ? '1' : '0'); } catch (e) {}
  overlay.classList.remove('show'); level = 1; score = 0; startLevel(false);
};
function updateSoundBtn() { $('soundBtn').textContent = soundOn ? '🔊 Sound' : '🔇 Muted'; }
$('soundBtn').onclick = () => {
  soundOn = !soundOn; updateSoundBtn();
  try { localStorage.setItem('cookieMatchSound', soundOn ? '1' : '0'); } catch (e) {}
  if (soundOn) blip(600, .1, 'triangle');
};

// auto-hint after a few idle seconds
setInterval(() => {
  if (!busy && !over && !hint && performance.now() - lastActivity > 7000) showHint();
}, 1000);

// ---------- Sizing ----------
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  const wrapW = Math.min(560, document.documentElement.clientWidth - 24);
  const used = $('app').offsetHeight - canvas.offsetHeight;
  const availH = window.innerHeight - used - 24;
  const size = Math.max(260, Math.floor(Math.min(wrapW, availH) / COLS) * COLS);
  cs = size / COLS;
  canvas.style.width = canvas.style.height = size + 'px';
  canvas.width = canvas.height = Math.round(size * dpr);
  $('boardWrap').style.width = size + 'px';
  $('boardWrap').style.height = size + 'px';
}
window.addEventListener('resize', resize);

// ---------- Boot ----------
(async function init() {
  updateSoundBtn(); updateTimerBtn(); updateCbBtn();
  const loaded = await Promise.all(COOKIE_SRC.map(loadImage));
  images = TYPE_DEFS.map(d => tint(loaded[d.img], d.hue, d.sat, d.bri, d.flip));
  grid = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
  resize();
  requestAnimationFrame(render);
  startLevel(false);
})();

})();
</script>
</body>
